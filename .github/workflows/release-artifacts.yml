name: Release artifacts

# Builds distributable Windows/Web bundles and uploads them as workflow
# artifacts for a maintainer to download manually. This workflow never
# creates/publishes a GitHub Release and never deploys anywhere -- it only
# produces zip archives + checksums attached to the run.
on:
  workflow_dispatch:
    inputs:
      version_label:
        description: >-
          Optional version label for archive file names (letters, digits,
          dot, dash, underscore only). Leave blank to derive one from the
          git ref automatically.
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.44.6

jobs:
  windows-release:
    name: Windows x64 release
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter build windows --release
        run: flutter build windows --release --no-pub

      - name: Derive sanitized version label
        env:
          INPUT_VERSION_LABEL: ${{ github.event.inputs.version_label }}
          REF_NAME: ${{ github.ref_name }}
        shell: pwsh
        run: |
          # Values coming from the workflow trigger (tag name / manual input)
          # are only ever read out of environment variables by the script
          # below, never spliced into a run: script body, so they cannot
          # inject shell syntax regardless of their content.
          $sanitized = & "${{ github.workspace }}/tool/ci/sanitize_version_label.ps1"
          Write-Output "VERSION_LABEL=$sanitized" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Package Windows release archive
        shell: pwsh
        run: |
          $archiveName = "human_status-windows-x64-$env:VERSION_LABEL.zip"
          $releaseDir = "build/windows/x64/runner/Release"
          if (-not (Test-Path $releaseDir)) {
            Write-Error "Release output not found at $releaseDir"
            exit 1
          }
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          Compress-Archive -Path "$releaseDir/*" -DestinationPath "dist/$archiveName" -Force
          $hash = Get-FileHash -Algorithm SHA256 "dist/$archiveName"
          "$($hash.Hash.ToLower())  $archiveName" | Out-File -FilePath "dist/$archiveName.sha256" -Encoding ascii -NoNewline
          Add-Content -Path "dist/$archiveName.sha256" -Value "" -Encoding ascii

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-release-${{ env.VERSION_LABEL }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  android-debug-apk:
    name: Android debug APK (sideload)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Builds an unsigned-for-store, debug-keystore-signed APK meant to be
    # sideloaded onto a personal device -- not for Play Store distribution.
    # No release keystore / repository secrets are needed or used here; see
    # docs/RELEASE_CHECKLIST.md section 5 for the separate, opt-in release
    # signing path if a store-ready build is ever needed.
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter build apk --debug
        run: flutter build apk --debug --no-pub

      - name: Derive sanitized version label
        env:
          INPUT_VERSION_LABEL: ${{ github.event.inputs.version_label }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # See the Windows job for why this reads env vars (inside the
          # script below) instead of interpolating the expression directly
          # into this step's script body.
          sanitized="$(bash "$GITHUB_WORKSPACE/tool/ci/sanitize_version_label.sh")"
          echo "VERSION_LABEL=$sanitized" >> "$GITHUB_ENV"

      - name: Package Android debug APK
        run: |
          set -euo pipefail
          apk_name="human_status-android-debug-${VERSION_LABEL}.apk"
          apk_src="build/app/outputs/flutter-apk/app-debug.apk"
          if [ ! -f "$apk_src" ]; then
            echo "Debug APK not found at $apk_src" >&2
            exit 1
          fi
          mkdir -p dist
          cp "$apk_src" "dist/$apk_name"
          (cd dist && sha256sum "$apk_name" > "$apk_name.sha256")

      - name: Upload Android artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-debug-apk-${{ env.VERSION_LABEL }}
          path: |
            dist/*.apk
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  web-release:
    name: Web release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter build web --release
        run: flutter build web --release --no-pub

      - name: Derive sanitized version label
        env:
          INPUT_VERSION_LABEL: ${{ github.event.inputs.version_label }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # See the Windows job for why this reads env vars (inside the
          # script below) instead of interpolating the expression directly
          # into this step's script body.
          sanitized="$(bash "$GITHUB_WORKSPACE/tool/ci/sanitize_version_label.sh")"
          echo "VERSION_LABEL=$sanitized" >> "$GITHUB_ENV"

      - name: Package Web release archive
        run: |
          set -euo pipefail
          archive_name="human_status-web-${VERSION_LABEL}.zip"
          release_dir="build/web"
          if [ ! -d "$release_dir" ]; then
            echo "Release output not found at $release_dir" >&2
            exit 1
          fi
          mkdir -p dist
          (cd "$release_dir" && zip -qr "$OLDPWD/dist/$archive_name" .)
          (cd dist && sha256sum "$archive_name" > "$archive_name.sha256")

      - name: Upload Web artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-release-${{ env.VERSION_LABEL }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
