org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin's incremental compiler cache tries to compute a relative path between
# the pub cache (C:) and this project (D:) and crashes on Windows when they're
# on different drive letters ("this and base files have different roots").
# Disabling incremental compilation avoids that; it's a project-level Gradle
# setting, not a Kotlin/plugin bug.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
